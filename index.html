<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="profile-card">
    <div class="avatar-container">
      <img src="https://via.placeholder.com/120" alt="Profile Picture" id="avatar">
    </div>
    <h2 id="name">Hajarathbabu</h2>
    <p class="title" id="title">Frontend Developer</p>
    <p class="bio" id="bio">Passionate about building responsive web applications and clean user interfaces.</p>
    
    <div class="stats">
      <div class="stat-item">
        <span class="stat-number">124</span>
        <span class="stat-label">Projects</span>
      </div>
      <div class="stat-item">
        <span class="stat-number">8.5k</span>
        <span class="stat-label">Followers</span>
      </div>
    </div>

    <button id="followBtn">Follow</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
